  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # [CUSTOMIZE] 测试环境 MySQL 的 dolphinscheduler 库（须先导入 dolphinscheduler_mysql.sql）
    url: jdbc:mysql://10.200.8.134:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8
    # [CUSTOMIZE]
    username: dlite
    # [CUSTOMIZE]
    password: DLite@123456
  quartz:
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
